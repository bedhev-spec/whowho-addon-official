name: Bug report
description: Report something that went wrong in WhoWho.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps we can follow to see the same bug.
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: WhoWho version
      description: Which version of the addon were you using when it happened?
    validations:
      required: true
  - type: textarea
    id: screenshots-or-video
    attributes:
      label: Screenshots or video
      description: If you can, attach a screenshot or video here, or paste a link.
